# Blueprint de Render: permite crear el servicio automaticamente
# desde este repositorio (New + -> Blueprint en render.com)
services:
  - type: web
    name: rifa-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Recomendado: usa estas 3 variables separadas en vez de MONGODB_URI
      # para evitar errores de copiado/pegado con la cadena completa.
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_DB
        value: rifa
      - key: RAFFLE_START
        value: "0"
      - key: RAFFLE_END
        value: "999"
      - key: ADMIN_KEY
        sync: false
